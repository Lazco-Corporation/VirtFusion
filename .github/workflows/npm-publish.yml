# Publish @lazco/virtfusion to npm.
#
# ── SHARED ACTIONS (ci-actions) ────────────────────────────────────────────
# infisical-fetch and npm-publish come from Lazco-Corporation/ci-actions@v1.
# Log and output format is defined there. npm-publish version-gates, skips a
# version that is already on the registry, signs with provenance, and verifies
# the dist-tag.
#
# ── CONFIG SOURCED FROM INFISICAL ──────────────────────────────────────────
#   Project: lazco-virtfusion   Path: /ci   Env-slug: prod
#   NPM_TOKEN   npm automation token with publish rights on @lazco
#
# The only GitHub-native config is the OIDC bootstrap:
#   vars.INFISICAL_CI_IDENTITY_ID   Infisical machine-identity id
#
# The job runs on a GitHub-hosted runner on purpose. Blacksmith is for heavy
# CPU or a warm disk cache, which an npm publish does not need.

name: Publish to NPM

on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check release trigger
    runs-on: ubuntu-24.04
    outputs:
      should_publish: ${{ steps.decide.outputs.should_publish }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Decide whether to publish
      id: decide
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        # workflow_dispatch runs against the ref the operator picks, and
        # actions/checkout follows that ref. Without this guard a manual run on
        # any branch or tag would publish its contents to npm.
        if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
          echo "::error::Releases run from main only. This run used $GITHUB_REF."
          exit 1
        fi

        if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
          echo "Manual trigger on main. Publishing."
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        commit_message=$(git log --format=%B -n 1 HEAD)
        if [[ $commit_message =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          echo "Commit message is a version. Publishing."
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
        else
          echo "Commit message is not a version. Skipping release."
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
        fi

  publish:
    name: Build and publish npm package
    needs: [check]
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm provenance + Infisical OIDC

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: "24"
        cache: "pnpm"

    - name: Install dependencies
      run: pnpm install

    - name: Build
      run: pnpm build

    - name: Fetch CI config from Infisical
      uses: Lazco-Corporation/ci-actions/infisical-fetch@v1
      with:
        project-slug: lazco-virtfusion
        env-slug: prod
        identity-id: ${{ vars.INFISICAL_CI_IDENTITY_ID }}
        required-keys: NPM_TOKEN

    - name: Publish to npm
      uses: Lazco-Corporation/ci-actions/npm-publish@v1
      with:
        token: ${{ env.NPM_TOKEN }}
        dist-tag: latest
        package-manager: pnpm
